<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roothold — Pinned Resident of the Garden</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#16a34a;--green-dark:#15803d;--green-2:#166534;--green-0:#86efac;
  --pine:#0d9488;--pine-1:#0f766e;
  --earth:#78350f;--earth-0:#fef3c7;--earth-1:#d97706;
  --sky:#0284c7;--sky-0:#7dd3fc;
  --paper:#ffffff;--paper-mint:#f0fdf4;--paper-1:#dcfce7;--paper-2:#bbf7d0;
  --ink:#0a0a0a;--surface-ink:#14211a;--grey:#808080;--grey-2:#595959;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-mint);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column}

/* layout */
.wrap{max-width:640px;margin:0 auto;padding:0 20px 80px;width:100%;flex:1}

/* masthead */
.masthead{text-align:center;padding:32px 0 16px;border-bottom:3px solid var(--surface-ink)}
.over{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--green-dark);margin-bottom:6px}
.masthead h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-family:var(--display);color:var(--surface-ink)}
.masthead h1 span{color:var(--green)}
.pitch{font-family:var(--body);font-size:14px;color:var(--grey-2);margin-top:10px;line-height:1.5;max-width:420px;margin-left:auto;margin-right:auto}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:var(--paper);border-top:2px solid var(--paper-1);
  display:flex;justify-content:center;gap:0;padding:0;
  box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bottom-nav button{flex:1;max-width:140px;background:none;border:none;cursor:pointer;
  font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--grey);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .15s}
.bottom-nav button:hover{color:var(--green-dark)}
.bottom-nav button.active{color:var(--green);font-weight:600}
.bottom-nav button .ico{font-size:16px;line-height:1;font-style:normal}

/* section */
.label{display:flex;align-items:baseline;gap:12px;font-family:var(--display);font-weight:500;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--surface-ink);margin-bottom:12px;margin-top:28px}
.label::after{content:'';flex:1;border-bottom:2px solid var(--paper-2);transform:translateY(-4px)}

/* card */
.card{background:var(--paper);border:2px solid var(--paper-1);border-radius:4px;padding:20px;
  box-shadow:4px 4px 0 0 var(--paper-2);margin-bottom:14px}
.card--pinned{border-color:var(--green-0);box-shadow:4px 4px 0 0 var(--green-0)}

/* lifted button */
.lb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.02em;
  padding:0 16px;height:36px;border:0;border-radius:2px;cursor:pointer;
  text-decoration:none;white-space:nowrap;user-select:none;
  background:var(--green);color:var(--paper-mint);
  box-shadow:3px 3px 0 0 var(--grey-2);transition:transform .12s,box-shadow .12s,background .12s}
.lb:hover{background:var(--green-dark);color:#fff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--grey-2)}
.lb:active{transform:translate(3px,3px);box-shadow:0 0 0 0 var(--grey-2)}
.lb--ghost{background:var(--paper);color:var(--green-dark);border:2px solid var(--green);box-shadow:3px 3px 0 0 var(--grey-2)}
.lb--ghost:hover{background:var(--paper-1);color:var(--green-2)}
.lb--sm{height:28px;padding:0 10px;font-size:10.5px;box-shadow:2px 2px 0 0 var(--grey-2)}
.lb--sm:active{transform:translate(2px,2px);box-shadow:0 0 0 0 var(--grey-2)}

/* garden map */
.garden-map{position:relative;width:100%;aspect-ratio:2;background:var(--paper-2);
  border-radius:4px;overflow:hidden;margin-bottom:0;border:2px solid var(--paper-1)}
.zone{position:absolute;border:1.5px dashed var(--green);border-radius:3px;
  display:flex;align-items:flex-end;justify-content:center;padding:4px;
  font-family:var(--display);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-2);opacity:.55}
.zone.active{background:rgba(22,163,74,.1);border-style:solid;opacity:1}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--green);
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:12px;font-weight:700;color:var(--green-2);
  box-shadow:2px 2px 0 0 var(--grey-2);transform:translate(-50%,-50%);z-index:2;
  transition:transform .2s,box-shadow .2s}
.pin.glow{border-color:var(--earth-1);box-shadow:0 0 0 4px rgba(217,119,6,.18),2px 2px 0 0 var(--grey-2)}
.pin-label{position:absolute;transform:translate(-50%,4px);font-family:var(--display);font-size:8px;
  letter-spacing:.06em;color:var(--green-dark);white-space:nowrap;z-index:2;text-align:center;font-weight:600}

/* pinned banner */
.pinned-hero{display:flex;align-items:center;gap:16px;padding:20px;
  background:linear-gradient(135deg,var(--paper-1),var(--paper-mint));
  border:2px solid var(--green-0);border-radius:4px;margin-top:14px;margin-bottom:14px;
  box-shadow:4px 4px 0 0 var(--green-0)}
.pinned-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:22px;font-weight:700;color:var(--paper-mint);flex-shrink:0;
  border:2.5px solid var(--green-dark)}
.pinned-info{flex:1;min-width:0}
.pinned-info .name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--surface-ink)}
.pinned-info .role{font-size:11px;color:var(--green-dark);font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-top:1px}
.pinned-info .note{font-size:12.5px;color:var(--grey-2);margin-top:3px}
.pin-badge{font-family:var(--display);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--paper-mint);background:var(--green);padding:4px 10px;border-radius:2px;font-weight:600;flex-shrink:0}

/* plot grid */
.plot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.plot{background:var(--paper);border:2px solid var(--paper-1);border-radius:3px;padding:10px 8px;text-align:center;
  box-shadow:2px 2px 0 0 var(--paper-2);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.plot:hover{border-color:var(--green-0);box-shadow:2px 2px 0 0 var(--green-0)}
.plot.assigned{border-color:var(--green);background:var(--paper-1)}
.plot .emoji{font-size:20px;line-height:1.2}
.plot .pname{font-family:var(--display);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-2);margin-top:3px;font-weight:500}
.plot .owner{font-size:9px;color:var(--grey);font-family:var(--mono);margin-top:1px}

/* stat */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:2px solid var(--paper-1);border-radius:4px;padding:14px 8px;text-align:center;
  box-shadow:3px 3px 0 0 var(--paper-2)}
.stat .n{font-family:var(--display);font-size:24px;font-weight:700;color:var(--green-2)}
.stat .t{font-size:9px;color:var(--grey);font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}

/* flow map */
.flow-map{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.flow-node{background:var(--paper);border:2px solid var(--paper-1);border-radius:4px;padding:16px 20px;
  box-shadow:3px 3px 0 0 var(--paper-2);cursor:pointer;text-decoration:none;color:inherit;
  display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .12s}
.flow-node:hover{border-color:var(--green);transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--paper-2)}
.flow-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0}
.flow-label{font-family:var(--display);font-weight:600;font-size:14px;color:var(--surface-ink)}
.flow-sub{font-size:11.5px;color:var(--grey);margin-top:2px}
.flow-arrow{margin-left:auto;font-family:var(--mono);color:var(--paper-2);font-size:18px}

/* coming next */
.coming-next{text-align:center;padding:48px 20px}
.coming-next h2{font-family:var(--display);font-size:24px;font-weight:700;color:var(--surface-ink);margin-bottom:10px}
.coming-next p{font-size:13.5px;color:var(--grey);max-width:360px;margin:0 auto}
.coming-next .tag{display:inline-block;font-family:var(--display);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pine);background:rgba(13,148,136,.08);padding:4px 12px;
  border-radius:2px;margin-bottom:16px;font-weight:500}

/* hint */
.hint{font-size:12.5px;color:var(--grey);margin-top:6px}

/* toast */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface-ink);color:var(--paper-mint);font-family:var(--display);font-size:12px;
  letter-spacing:.06em;padding:8px 20px;border-radius:3px;opacity:0;transition:transform .3s,opacity .3s;
  box-shadow:4px 4px 0 0 var(--grey-2);z-index:20;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* page transition */
[data-page]{animation:fadeUp .22s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head><body>
<div class="wrap">
  <div class="masthead">
    <div class="over">the convent &middot; the crown</div>
    <h1><span>Root</span>hold</h1>
    <p class="pitch">Pin a resident to the garden and the garden remembers who tends it.</p>
  </div>
  <div id="app"></div>
</div>

<nav class="bottom-nav" id="bnav">
  <button data-screen="#/"><i class="ico">&#9670;</i>Garden</button>
  <button data-screen="#/flow"><i class="ico">&#9633;</i>Flow</button>
  <button data-screen="#/s/2"><i class="ico">&#9651;</i>Plots</button>
  <button data-screen="#/s/3"><i class="ico">&#9711;</i>Schedule</button>
  <button data-screen="#/s/4"><i class="ico">&#9674;</i>Harvest</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ---- data ---- */
const PINNED = {id:'sol',name:'Sol',init:'S',color:'#16a34a',
  role:'Raised Bed Steward',note:'watering & weeding the raised beds every morning'};

const PLOTS = [
  {id:'b1',name:'Bed #1',emoji:'\u{1F345}',plant:'Tomato',owner:'Sol'},
  {id:'b2',name:'Bed #2',emoji:'\u{1F33F}',plant:'Basil',owner:'Sol'},
  {id:'b3',name:'Bed #3',emoji:'\u{1F966}',plant:'Kale',owner:'Mika'},
  {id:'b4',name:'Bed #4',emoji:'\u{1F336}',plant:'Peppers',owner:'Ron'},
  {id:'h1',name:'Herb A',emoji:'\u{1F33F}',plant:'Mint',owner:null},
  {id:'h2',name:'Herb B',emoji:'\u{1F33B}',plant:'Marigold',owner:null},
  {id:'c1',name:'Compost',emoji:'\u{267B}',plant:'Active',owner:'Jules'},
  {id:'s1',name:'Seating',emoji:'\u{1FA91}',plant:'Bench',owner:null},
];

const ZONES = [
  {id:'beds', name:'Raised Beds', x:4,  y:8,  w:38, h:58},
  {id:'herb', name:'Herb Spiral', x:46, y:12, w:24, h:48},
  {id:'sit',  name:'Seating',     x:74, y:6,  w:23, h:36},
  {id:'comp', name:'Compost',     x:74, y:50, w:23, h:32},
];

let pinned = true;

/* ---- util ---- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function setNav(hash){document.querySelectorAll('#bnav button').forEach(b=>{b.classList.toggle('active',b.dataset.screen===hash)})}

/* ---- pages ---- */
function pageHero(){
  setNav('#/');
  const app=document.getElementById('app');
  let h='<div data-page>';

  /* garden map */
  h+=`<div class="label">The Green &middot; Rooftop</div>`;
  h+=`<div class="garden-map">`;
  ZONES.forEach(z=>{
    h+=`<div class="zone${z.id==='beds'?' active':''}" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%">${z.name}</div>`;
  });
  if(pinned){
    h+=`<div class="pin glow" style="left:22%;top:36%">${esc(PINNED.init)}</div>`;
    h+=`<div class="pin-label" style="left:22%;top:46%">${esc(PINNED.name)}</div>`;
  }
  h+=`</div>`;

  /* pinned banner */
  if(pinned){
    h+=`<div class="pinned-hero">
      <div class="pinned-av" style="background:${PINNED.color}">${esc(PINNED.init)}</div>
      <div class="pinned-info">
        <div class="name">${esc(PINNED.name)}</div>
        <div class="role">${esc(PINNED.role)}</div>
        <div class="note">${esc(PINNED.note)}</div>
      </div>
      <div class="pin-badge">Pinned</div>
    </div>`;
  }

  /* toggle pin */
  h+=`<div style="text-align:center;margin:18px 0 8px">
    <button class="lb ${pinned?'lb--ghost':''}" id="pinToggle">${pinned?'Unpin from Garden':'Pin to Garden'}</button>
  </div>`;
  h+=`<p class="hint" style="text-align:center">One click pins a resident to The Green as its steward.</p>`;

  /* plot preview */
  h+=`<div class="label">Assigned Plots</div>`;
  h+=`<div class="plot-grid">`;
  PLOTS.filter(p=>p.owner==='Sol').forEach(p=>{
    h+=`<div class="plot assigned">
      <div class="emoji">${p.emoji}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="owner">${esc(p.plant)}</div>
    </div>`;
  });
  h+=`</div>`;

  /* stats */
  h+=`<div class="stat-row">
    <div class="stat"><div class="n">14</div><div class="t">Garden Hrs</div></div>
    <div class="stat"><div class="n">2</div><div class="t">Plots</div></div>
    <div class="stat"><div class="n">5</div><div class="t">Hearts</div></div>
  </div>`;

  h+='</div>';
  app.innerHTML=h;

  document.getElementById('pinToggle').addEventListener('click',()=>{
    pinned=!pinned;
    toast(pinned?'Sol pinned to The Green':'Sol unpinned from The Green');
    pageHero();
  });
}

function pageFlow(){
  setNav('#/flow');
  const screens=[
    {hash:'#/',    label:'Garden Map',   sub:'Pinned resident & zone overview',ico:'#16a34a'},
    {hash:'#/s/2', label:'Plot Manager', sub:'Assign beds & herbs to residents',ico:'#0d9488'},
    {hash:'#/s/3', label:'Schedule',     sub:'Weekly watering & task rotation',ico:'#0284c7'},
    {hash:'#/s/4', label:'Harvest Log',  sub:'Track yield & share with the house',ico:'#d97706'},
    {hash:'#/',    label:'Resident Pins',sub:'Pin / unpin stewards on the map',ico:'#7c3aed'},
  ];
  let h='<div data-page>';
  h+=`<div class="label">Flow Map</div>`;
  h+=`<p class="hint" style="margin-bottom:8px;margin-top:-4px">The five screens of Roothold.</p>`;
  h+=`<div class="flow-map">`;
  screens.forEach(s=>{
    h+=`<a class="flow-node" href="${s.hash}">
      <div class="flow-ico" style="background:${s.ico}22;color:${s.ico}"><b>&#9632;</b></div>
      <div><div class="flow-label">${esc(s.label)}</div><div class="flow-sub">${esc(s.sub)}</div></div>
      <div class="flow-arrow">&rarr;</div>
    </a>`;
  });
  h+=`</div>`;
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function pagePlots(){
  setNav('#/s/2');
  let h='<div data-page>';
  h+=`<div class="coming-next">
    <div class="tag">Coming Next</div>
    <h2>Plot Manager</h2>
    <p>Drag residents onto garden beds to assign stewardship. Each plot tracks what's planted, who's watering, and when it was last tended.</p>
  </div>`;
  h+=`<div class="label">All Plots</div>`;
  h+=`<div class="plot-grid">`;
  PLOTS.forEach(p=>{
    h+=`<div class="plot${p.owner?' assigned':''}">
      <div class="emoji">${p.emoji}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="owner">${p.owner?esc(p.owner):'open'}</div>
    </div>`;
  });
  h+=`</div>`;
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function pageSchedule(){
  setNav('#/s/3');
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let h='<div data-page>';
  h+=`<div class="coming-next">
    <div class="tag">Coming Next</div>
    <h2>Weekly Schedule</h2>
    <p>Auto-rotate watering duty among pinned stewards. Salem sends a reminder DM each morning with today's tasks.</p>
  </div>`;
  h+=`<div class="label">This Week</div>`;
  days.forEach((d,i)=>{
    const who=i%3===0?'Sol':i%3===1?'Mika':'Ron';
    h+=`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px">
      <span style="font-family:var(--mono);font-size:11px;color:var(--grey);width:32px">${d}</span>
      <span style="font-family:var(--display);font-size:13px;flex:1">${esc(who)} &mdash; water beds</span>
      <span style="font-size:11px;color:var(--green)">${i<3?'done':'&middot;'}</span>
    </div>`;
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function pageHarvest(){
  setNav('#/s/4');
  let h='<div data-page>';
  h+=`<div class="coming-next">
    <div class="tag">Coming Next</div>
    <h2>Harvest Log</h2>
    <p>Record what the garden yields each week. Share a bulletin with the house so residents know what's ripe for the taking.</p>
  </div>`;
  h+=`<div class="label">Recent Harvests</div>`;
  const harvests=[
    {date:'Aug 21',item:'Cherry tomatoes',qty:'2 lbs',who:'Sol'},
    {date:'Aug 18',item:'Basil bunch',qty:'1 bundle',who:'Sol'},
    {date:'Aug 14',item:'Kale leaves',qty:'0.5 lbs',who:'Mika'},
  ];
  harvests.forEach(v=>{
    h+=`<div class="card" style="padding:14px 16px">
      <div style="font-family:var(--display);font-weight:600;font-size:14px">${esc(v.item)}</div>
      <div style="font-size:12px;color:var(--grey);margin-top:3px">${esc(v.date)} &middot; ${esc(v.qty)} &middot; ${esc(v.who)}</div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

/* ---- router ---- */
function route(){
  const h=location.hash||'#/';
  if(h==='#/'||h==='#') pageHero();
  else if(h==='#/flow') pageFlow();
  else if(h==='#/s/2') pagePlots();
  else if(h==='#/s/3') pageSchedule();
  else if(h==='#/s/4') pageHarvest();
  else pageHero();
}

document.getElementById('bnav').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-screen]');
  if(!btn) return;
  location.hash=btn.dataset.screen;
});

window.addEventListener('hashchange',route);
route();
</script>
</body></html>
